<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Zoo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav" aria-label="Main navigation">
                <a href="#" class="nav__logo" aria-label="Online Zoo home">
                    <img src="../../assets/icons/Logo.svg" alt="Online Zoo" width="96" height="50">
                </a>
                <ul class="nav__menu" role="menubar">
                    <li role="none"><a href="#" class="nav__link nav__link--active">About</a></li>
                    <li role="none"><a href="#" class="nav__link">Map</a></li>
                    <li role="none"><a href="#" class="nav__link">Zoos</a></li>
                    <li role="none"><a href="#" class="nav__link">Contact us</a></li>
                    <li role="none"><a href="#" class="nav__link">Design</a></li>
                </ul>
                <div class="nav__social">
                    <a href="#" class="nav__social-link" aria-label="YouTube">
                        <img src="../../assets/icons/YouTube.svg" alt="youtube" width="40" height="40">
                    </a>
                    <a href="#" class="nav__social-link" aria-label="Instagram">
                        <img src="../../assets/icons/Instagram.svg" alt="instagram" width="40" height="40">
                    </a>
                    <a href="#" class="nav__social-link" aria-label="Facebook">
                        <img src="../../assets/icons/Facebook.svg" alt="facebook" width="40" height="40">
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <div class="hero__content">
                    <h1 class="hero__title">Watch Your Favorite Animal Online</h1>
                    <p class="hero__description">Explore the exciting and mysterious world of wild animals in a natural setting without leaving your home.</p>
                    <a href="#" class="btn btn--primary" aria-label="View live camera feed">
                        <span>View Live Cam</span>
                        <svg width="24" height="22" viewBox="0 0 24 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M0 11H21.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
                            <path d="M13 1L23 11L13 21" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
