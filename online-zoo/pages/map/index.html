    <main>
        <section class="map-section" aria-label="Find where the animals live">
            <div class="container map-section__container">
                <h1 class="section-title map-section__title">Find where are the animals live</h1>
                <div class="map-section__map">
                    <img class="map-section__image" src="../../assets/images/Map.svg" alt="World map showing locations of Online Zoo animals" width="1406" height="912" loading="lazy">

                    <!-- West End Bald Eagles (North America, west coast) -->
                    <button class="map-pin map-pin--eagles" type="button" aria-label="West End Bald Eagles in North America">
                        <img src="../../assets/icons/animal-location-eagles.svg" alt="" width="80" height="80" loading="lazy">
                    </button>

                    <!-- Chinese Alligator (China) -->
                    <button class="map-pin map-pin--alligator" type="button" aria-label="Chinese Alligator in China">
                        <img src="../../assets/icons/animal-location-alligator.svg" alt="" width="80" height="80" loading="lazy">
                    </button>

                    <!-- Gorilla in Congo (Central Africa) -->
                    <button class="map-pin map-pin--gorilla" type="button" aria-label="Gorilla in Congo in Central Africa">
                        <img src="../../assets/icons/animal-location-gorilla.svg" alt="" width="80" height="80" loading="lazy">
                    </button>

                    <!-- African Lion (East Africa) -->
                    <button class="map-pin map-pin--lion" type="button" aria-label="African Lion in East Africa">
                        <img src="../../assets/icons/animal-location-lion.svg" alt="" width="80" height="80" loading="lazy">
                    </button>

                    <!-- Madagascarian Lemur (Madagascar) -->
                    <button class="map-pin map-pin--lemur" type="button" aria-label="Madagascarian Lemur in Madagascar">
                        <img src="../../assets/icons/animal-location-lemur.svg" alt="" width="80" height="80" loading="lazy">
                    </button>

                    <!-- Sumatran Tiger (Indonesia) -->
                    <button class="map-pin map-pin--tiger" type="button" aria-label="Sumatran Tiger in Indonesia">
                        <img src="../../assets/icons/animal-location-tiger.svg" alt="" width="80" height="80" loading="lazy">
                    </button>

                    <!-- Giant Panda (China / East Asia) -->
                    <button class="map-pin map-pin--panda" type="button" aria-label="Giant Panda in China">
                        <img src="../../assets/icons/animal-location-panda.svg" alt="" width="80" height="80" loading="lazy">
                    </button>

                    <!-- Australian Koala (Australia) -->
                    <button class="map-pin map-pin--koala" type="button" aria-label="Australian Koala in Australia">
                        <img src="../../assets/icons/animal-location-australian-koala.svg" alt="" width="80" height="80" loading="lazy">
                    </button>
                </div>
            </div>
        </section>
    </main>
